name: rando_core
description: "Modèles, géo, import de sources, accès Firestore et thème partagés par les apps Rando Oise."
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.4
  flutter: ">=3.41.0"

dependencies:
  archive: ^4.3.0
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flutter:
    sdk: flutter
  latlong2: ^0.10.1
  proj4dart: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
          weight: 400
        - asset: fonts/Inter-Medium.ttf
          weight: 500
        - asset: fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: fonts/Inter-Bold.ttf
          weight: 700
        - asset: fonts/Inter-ExtraBold.ttf
          weight: 800
    - family: InterDisplay
      fonts:
        - asset: fonts/InterDisplay-Bold.ttf
          weight: 700
        - asset: fonts/InterDisplay-ExtraBold.ttf
          weight: 800
