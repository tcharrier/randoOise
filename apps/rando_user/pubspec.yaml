name: rando_user
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  geolocator: ^14.0.3
  http: ^1.6.0
  latlong2: ^0.10.1
  maplibre_gl: 0.25.0
  provider: ^6.1.5+1
  rando_core:
    path: ../../packages/rando_core
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  wakelock_plus: ^1.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/velo/itineraries_min.jsonl
    - assets/velo/geoms.wkb
    - assets/velo/meta.json
    - assets/velo/plan_arc.json
    - assets/styles/osm.json
    - assets/styles/ign.json
